name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test
      # Builds the release binary the app bundle is made from; signing needs
      # a certificate and stays local.
      - name: Build release
        run: swift build -c release
