name: PR

# Checks on the pull request itself rather than its code. A body edit
# changes the issues it closes, so edited runs this again (and not CI).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

# closingIssuesReferences leaves out issues the token can't read, so
# without issues: read it always comes back empty.
permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  closing-issues:
    name: Closes at most one issue
    runs-on: ubuntu-latest
    steps:
      # GitHub closes every issue the body links with a closing keyword,
      # prose such as "fixes #12's leftover" included. A PR closes its own
      # issue or none (chores and docs).
      #
      # The token reads this repository only, so closingIssuesReferences
      # leaves out issues in other repositories ("closes other-org/other-repo#12").
      # The body's "<keyword> owner/repo#N" references stand in for those.
      # A closing keyword in front of an issue URL in another repository
      # still slips through.
      - name: Count closing references
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          linked=$(gh pr view "$PR" --repo "$REPO" --json closingIssuesReferences \
            --jq '.closingIssuesReferences[] | "\(.repository.owner.login)/\(.repository.name)#\(.number)"')
          written=$(gh pr view "$PR" --repo "$REPO" --json body --jq .body \
            | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#[0-9]+' \
            | awk '{ print $NF }' || true)
          issues=$(printf '%s\n%s\n' "$linked" "$written" | tr 'A-Z' 'a-z' | grep . | sort -u || true)
          count=$(printf '%s' "$issues" | grep -c . || true)
          list=$(printf '%s' "$issues" | paste -sd ' ' -)
          if [ "$count" -gt 1 ]; then
            echo "::error::This PR closes $count issues: $list. A PR closes at most one. Reword the others without a closing keyword (\"part of #N\", \"see #N\")."
            exit 1
          fi
          echo "Closes ${list:-no issue}."
